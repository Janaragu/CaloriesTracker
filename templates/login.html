{% extends "base.html" %}
{% block title %}Login - CalorieSnap{% endblock %}
{% block content %}
<nav class="bg-white dark:bg-gray-800 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <a href="/" class="text-2xl font-bold text-green-600">🍎 CalorieSnap</a>
        <button onclick="toggleDarkMode()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
            <span class="dark:hidden">🌙</span><span class="hidden dark:inline">☀️</span>
        </button>
    </div>
</nav>

<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="text-5xl mb-4">👋</div>
            <h1 class="text-3xl font-bold mb-2 dark:text-white">Welcome Back</h1>
            <p class="text-gray-600 dark:text-gray-400">Sign in to continue tracking</p>
        </div>
        
        <form id="loginForm" class="space-y-6">
            <input type="email" id="email" placeholder="Email" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-green-500 outline-none">
            <input type="password" id="password" placeholder="Password" required class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 dark:text-white focus:ring-2 focus:ring-green-500 outline-none">
            <button type="submit" id="submitBtn" class="w-full py-3 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 disabled:opacity-50">Login</button>
        </form>
        
        <p class="text-center mt-6 text-gray-600 dark:text-gray-400">
            Don't have an account? <a href="/signup" class="text-green-600 font-semibold hover:text-green-700">Sign up</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Logging in...';
    
    const result = await apiCall('/api/login', {
        method: 'POST',
        body: JSON.stringify({
            email: document.getElementById('email').value,
            password: document.getElementById('password').value
        })
    });
    
    if (result.success) {
        window.location.href = result.redirect;
    } else {
        showAlert(result.error || 'Login failed', 'error');
        btn.disabled = false;
        btn.textContent = 'Login';
    }
});
</script>
{% endblock %}

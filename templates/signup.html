{% extends "base.html" %}

{% block title %}Sign Up - CalorieSnap{% endblock %}

{% block content %}
<!-- Navbar -->
<nav class="bg-white dark:bg-gray-800 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
        <a href="/" class="text-2xl font-bold text-green-600">🍎 CalorieSnap</a>
        <button onclick="toggleDarkMode()" class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
            <span class="dark:hidden">🌙</span>
            <span class="hidden dark:inline">☀️</span>
        </button>
    </div>
</nav>

<!-- Signup Form -->
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <div class="text-5xl mb-4">🚀</div>
            <h1 class="text-3xl font-bold mb-2 dark:text-white">Create Account</h1>
            <p class="text-gray-600 dark:text-gray-400">Start your fitness journey today</p>
        </div>
        
        <form id="signupForm" class="space-y-6">
            <div>
                <input 
                    type="text" 
                    id="fullName" 
                    placeholder="Full Name" 
                    required
                    class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition bg-white dark:bg-gray-700 dark:text-white"
                >
            </div>
            <div>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="Email" 
                    required
                    class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition bg-white dark:bg-gray-700 dark:text-white"
                >
            </div>
            <div>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Password (min 6 characters)" 
                    required
                    minlength="6"
                    class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition bg-white dark:bg-gray-700 dark:text-white"
                >
            </div>
            <div>
                <select 
                    id="language"
                    class="w-full px-4 py-3 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none transition bg-white dark:bg-gray-700 dark:text-white"
                >
                    <option value="en">🇬🇧 English</option>
                    <option value="de">🇩🇪 Deutsch</option>
                </select>
            </div>
            <button 
                type="submit" 
                id="submitBtn"
                class="w-full py-3 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 transition disabled:opacity-50"
            >
                Create Account
            </button>
        </form>
        
        <p class="text-center mt-6 text-gray-600 dark:text-gray-400">
            Already have an account? 
            <a href="/login" class="text-green-600 font-semibold hover:text-green-700">Login</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.textContent = 'Creating account...';
        
        const result = await apiCall('/api/signup', {
            method: 'POST',
            body: JSON.stringify({
                full_name: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                language: document.getElementById('language').value
            })
        });
        
        if (result.success) {
            showAlert(result.message, 'success');
            setTimeout(() => window.location.href = '/login', 1500);
        } else {
            showAlert(result.error || 'Signup failed', 'error');
            btn.disabled = false;
            btn.textContent = 'Create Account';
        }
    });
</script>
{% endblock %}
